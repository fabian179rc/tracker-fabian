name: Mantener Supabase activo
on:
  schedule:
    - cron: '0 12 * * 1,4,6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tocar la API de Supabase (cuenta como actividad)
        run: |
          URL=$(grep -o "SB_URL='[^']*'" index.html | cut -d"'" -f2)
          KEY=$(grep -o "SB_KEY='[^']*'" index.html | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/days?select=day&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondió HTTP $code"
          test "$code" -lt 500
      - name: Latido en el repo (evita que GitHub pause el workflow a los 60 días)
        run: |
          date -u +"%Y-%m-%d" > .heartbeat
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git add .heartbeat
          git commit -m "latido $(cat .heartbeat)" || exit 0
          git push
