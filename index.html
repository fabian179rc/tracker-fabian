<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--brand:#0F6E56;--brand2:#1D9E75;--brand-bg:#E1F5EE;--amber:#BA7517;--amber-bg:#FAEEDA;--blue:#185FA5;--blue-bg:#E6F1FB;--red:#C0392B;--red-bg:#FBE9E7;
--bg:#F3F4F1;--card:#fff;--line:#E6E7E1;--text:#1F2421;--muted:#7A7F78;--shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.04)}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);font-size:15px;line-height:1.4;min-height:100vh;padding-bottom:84px}
.app{max-width:1440px;margin:0 auto}
.top{position:sticky;top:0;z-index:50;background:#F3F4F1;padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;column-gap:20px}
.top .datenav{flex:1;min-width:260px}
.top h1{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:4px;max-width:420px}
.datenav .dl{font-size:20px;font-weight:700;letter-spacing:-.01em;text-align:center;flex:1;cursor:pointer}
.datenav .dl small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;color:var(--text);cursor:pointer}
.ib:active{background:var(--brand-bg)}
.panel{padding:14px 14px 0}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.g,.col{display:flex;flex-direction:column;gap:12px}
.g{margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--brand-bg);color:var(--brand)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .3s}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.sub{font-size:12px;color:var(--muted)}
.scale-l{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:0 0 6px}
.scale-l span:last-child{color:var(--muted);font-weight:500}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-bottom:14px}
.scale:last-child{margin-bottom:0}
.scale button{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:600;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer;padding:0}
.scale button.on{color:#fff;border-color:transparent}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row:last-child{border-bottom:none;padding-bottom:0}.row:first-child{padding-top:0}
.row .lab{flex:1;font-size:15px}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid #C9CCC4;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.12s}
.cb.on{background:var(--brand2);border-color:var(--brand2)}
.cb.on::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:13px;font-weight:600;background:var(--card);cursor:pointer;color:var(--muted);user-select:none}
.chip .e{display:block;font-size:20px;margin-bottom:2px}
.chip.on{background:var(--brand-bg);border-color:var(--brand2);color:var(--brand)}
.sleepbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sleepin{width:84px;font-size:28px;font-weight:800;text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px;font-family:inherit;background:var(--bg);color:var(--text)}.sleepu{font-size:13px;font-weight:600;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer;color:var(--text)}
.stepper button:active{background:var(--brand-bg)}
.stepper .v{min-width:64px;text-align:center;font-size:30px;font-weight:800;letter-spacing:-.02em}
.stepper .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.split{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tog{width:50px;height:30px;border-radius:99px;background:#CDD0C8;position:relative;cursor:pointer;flex-shrink:0;transition:.15s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--brand2)}.tog.on::after{left:23px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;color:var(--text);background:var(--bg);outline:none;resize:vertical}
textarea{min-height:64px}
textarea:focus,input[type=text]:focus{border-color:var(--brand2);background:#fff}
.btn{border:none;background:var(--brand);color:#fff;font-weight:600;font-size:14px;font-family:inherit;padding:11px 16px;border-radius:12px;cursor:pointer}
.btn.ghost{background:var(--brand-bg);color:var(--brand)}
.btn:active{opacity:.85}
.meal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.meal-h b{font-size:16px}.meal-h b span{margin-right:6px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
.pill.on{background:var(--brand-bg);border-color:var(--brand2);color:var(--brand)}
.snack{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.snack:last-child{border-bottom:none}
.snack .tm{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:8px;padding:3px 7px}
.snack .tx{flex:1}
.snack button{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
.dtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dtabs button{padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;line-height:1.3}
.dtabs button small{display:block;font-weight:500;font-size:11px}
.dtabs button.on{background:var(--brand-bg);border-color:var(--brand2);color:var(--brand)}
.ex{padding:9px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none;padding-bottom:0}.ex:first-child{padding-top:0}
.ex-top{display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:14px}.ex.done .ex-name{color:var(--muted);text-decoration:line-through}
.ex-ser{font-size:12px;font-weight:600;color:var(--brand);margin-top:1px}
.ex-desc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.thumbs{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.thumbs img{width:56px;height:56px;border-radius:10px;display:block;cursor:zoom-in;border:1px solid var(--line);background:var(--brand-bg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .n small{font-size:14px;font-weight:600;color:var(--muted)}
.tr{font-size:12px;font-weight:600}.tr.up{color:var(--brand2)}.tr.down{color:var(--red)}.tr.flat{color:var(--muted)}
.seg{display:flex;background:#E4E6DF;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1/1;border-radius:10px;border:1.5px solid transparent;background:var(--bg);font-weight:600;font-size:13px;font-family:inherit;color:var(--text);cursor:pointer}
.cal button.e{visibility:hidden}
.cal button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 3px}.cal .dn2{font-size:13px;line-height:1}
.cal button.c0{background:#EEF0EA}.cal button.c1{background:#D5EDE3}.cal button.cg{background:#4FB58D;color:#fff}.cal button.cm{background:#7DB7E8;color:#fff}.cal button.cd{background:#E3A917;color:#fff}.cal button.cr{background:#E1E3DC;color:var(--muted)}.legend i.sqL{width:12px;height:12px}
.legend i.sqL{border-radius:3px;display:inline-block}
.cal button.l1{background:#D5EDE3}.cal button.l2{background:#9FD9C0}.cal button.l3{background:#4FB58D;color:#fff}.cal button.l4{background:#0F6E56;color:#fff}

.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:16px;text-transform:capitalize}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--bg);color:var(--text)}
.tag.g{background:var(--brand-bg);color:var(--brand)}.tag.a{background:var(--amber-bg);color:var(--amber)}.tag.b{background:var(--blue-bg);color:var(--blue)}.tag.r{background:var(--red-bg);color:var(--red)}
.dl-t{font-size:13px;margin-top:8px}.dl-t b{color:var(--muted);font-weight:600}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.tabbar>div{display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{border:none;background:none;padding:9px 0 8px;font-weight:600;font-size:10.5px;font-family:inherit;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#1F2421;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
.lb{position:fixed;inset:0;background:rgba(15,20,18,.78);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.lb.show{display:flex}.lb img{width:min(88vw,420px);border-radius:16px;background:#fff}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.saved{font-size:11px;color:var(--muted)}
.foot{display:flex;gap:8px}.foot .btn{flex:1}
@media(max-width:600px){.ex-top{flex-wrap:wrap}.ex-main{flex-basis:calc(100% - 44px)}.thumbs{margin-left:34px;max-width:none;justify-content:flex-start}}

.abox{background:#fff;border-radius:16px;padding:20px;width:min(360px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.abox h3{font-size:17px;margin-bottom:6px}.abox p{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.45}
.abox input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;margin-bottom:8px}
.arow{display:flex;gap:8px;margin-top:6px}.arow .btn{flex:1}.aerr{font-size:12px;color:var(--red);margin-top:8px;min-height:14px}
.compact .dn{margin-left:5px;padding:0 6px}
.tm{gap:12px;flex-wrap:wrap}.tm .tc{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:2px 8px;border-radius:10px;border:1.5px solid transparent}
.tm .tc small{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tm .tc b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.tm .tc.cur{border-color:var(--brand2);background:var(--brand-bg)}.tm .tc.run b{color:var(--brand)}.tm .tc.fin small:after{content:' ✓';color:var(--brand2)}
.tm .tc.tot{border-left:1.5px solid var(--line);border-radius:0;padding-left:12px}
.win{display:none;position:fixed;inset:0;z-index:120;background:rgba(20,14,0,.72);align-items:center;justify-content:center;padding:16px;overflow:hidden;cursor:pointer}.win.show{display:flex}
.wbox{position:relative;text-align:center;background:radial-gradient(circle at 50% 0,#3b2a00,#150f00 70%);border:3px solid #F5C518;border-radius:26px;padding:22px 30px 18px;max-width:min(94vw,420px);box-shadow:0 0 60px rgba(245,197,24,.55),inset 0 0 30px rgba(245,197,24,.15);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.medal{width:150px;height:auto;filter:drop-shadow(0 6px 14px rgba(245,197,24,.55));animation:bob 2.2s ease-in-out infinite}
.wt{font-size:30px;font-weight:900;line-height:1.05;letter-spacing:.02em;margin-top:6px;background:linear-gradient(180deg,#FFF3B0,#F5C518 55%,#B8860B);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ws{color:#FFE9A0;font-size:14px;font-weight:600;margin-top:8px}
.wtm{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}.wtm div{background:rgba(245,197,24,.14);border:1px solid rgba(245,197,24,.5);border-radius:10px;padding:5px 10px}
.wtm small{display:block;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#E8C75A}.wtm b{font-size:16px;color:#FFF3B0;font-variant-numeric:tabular-nums}
.wtm .tt{background:#F5C518}.wtm .tt small,.wtm .tt b{color:#3b2a00}
.wh{margin-top:12px;font-size:11px;color:#B8993A}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}.conf i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{top:104%;margin-left:30px}}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bob{50%{transform:translateY(-6px)}}
@media(min-width:900px){
 body{zoom:var(--z,1);min-height:var(--vh,100vh)}
 .app{max-width:none}
 .panel{padding-left:16px;padding-right:16px}
 .top{padding-left:16px;padding-right:16px}
 body.fit{height:var(--vh,100vh);overflow:hidden;padding-bottom:0}
 body.fit .app{height:100%;display:flex;flex-direction:column}
 body.fit .panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 16px 34px}

 body.fit .g.ent .info{width:1.8em;height:1.8em;font-size:.8em}
 body.fit .g.ent .exm{height:2em;display:flex;align-items:center;flex-wrap:nowrap;overflow:hidden;font-size:.78em}
 body.fit .g.ent .exm>*{margin-left:0;margin-right:.6em;white-space:nowrap}
 body.fit .g.ent .exm .dn{padding:0 .6em}
 body.fit .nt .nl{height:4.2em;overflow-y:auto;flex:0 0 auto}
 body.fit .nt .empty{font-size:.85em;padding:.4em!important}
 body.fit .toprow .eq .ct{white-space:nowrap}
 body.fit .toprow .eq-list{gap:10px}
 body.fit .toprow .eq-list figcaption i{display:none}
 body.fit .toprow .tm{gap:4px}
 body.fit .toprow .tm .tc{min-width:0;padding:2px 6px}
 body.fit .nt .addrow{margin-top:.4em}
 body.fit .nt .addrow input{min-width:0;font-size:inherit;padding:.3em .5em}
 body.fit .nt .addrow .btn{font-size:inherit;padding:.3em .8em}
 body.fit .nt .snack{padding:.25em 0;font-size:.85em}
 body.fit .cloud{bottom:6px;right:8px}
}
.exm:empty{display:none}.exm{display:block}
@media(min-width:900px){body.narrow #view{max-width:820px;margin-left:auto;margin-right:auto}body.mid #view{max-width:1150px;margin-left:auto;margin-right:auto}}
.eq{min-width:0;overflow:hidden}.eq-list{min-width:0;max-width:100%;overflow-x:auto}
html{scrollbar-gutter:stable}
.ch.sub{margin-top:.6em}
@media(min-width:900px){

 .eq{position:relative;min-height:60px}
 .eq-list,body.fit .toprow .eq-list{position:absolute;left:10px;right:10px;top:17px;bottom:3px;display:flex;flex-wrap:wrap;align-content:space-evenly;justify-content:space-evenly;align-items:center;gap:2px 10px;overflow:hidden;max-width:100%}
 .eq-list figure{display:flex;align-items:center;gap:5px;min-width:0}
 .eq-list figcaption,body.fit .toprow .eq-list figcaption{font-size:var(--eqf,11.5px);white-space:nowrap}
 body.fit .toprow .eq-list figcaption i{display:inline}
 .eq-list img{width:var(--eqi,30px);height:var(--eqi,30px)}
 .eq .ct{text-align:center}
 .eq-list,body.fit .toprow .eq-list{flex-wrap:nowrap;justify-content:space-evenly;align-content:center;align-items:center;gap:0 10px;text-align:left}
 .eq-list figure{flex:none}
}

const KEY='fabian_tracker_v3', OLDKEY='fabian_tracker_v2';
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MEALS=[['des','Desayuno','🍳'],['alm','Almuerzo','🍽️'],['mer','Merienda','🥪'],['cen','Cena','🥘']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromKey=k=>{const [y,m,d]=k.split('-');return new Date(+y,+m-1,+d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return mk(d)};
const todayKey=()=>mk(new Date());
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;

function newDay(){return{mv:1,neck:null,back:null,energy:null,sleep:8,sleepSet:false,goals:[],pomos:0,prot:{des:false,alm:false,mer:false,cen:false},
 fast:{on:false,h:14},sweets:0,sweetsPlanned:false,train:null,habits:{respiro:false,camine:false,levante:false,micro:false},
 meals:{des:'',alm:'',mer:'',cen:''},snacks:[],enotes:[],note:'',wk:{},sess:null,ph:null,tm:{},last:null,lastEx:null}}
function migrate(o){const m=o.metrics||{},c=o.checks||{},d=newDay();
 d.neck=num(m.cuello);d.back=num(m.espalda);d.energy=num(m.energia);d.sleep=num(m.sueno);
 if(c.proteina)MEALS.forEach(x=>d.prot[x[0]]=true);
 d.sweetsPlanned=!!c.dulce;d.train=c.entreno?'train':null;
 d.habits={respiro:!!c.respiro,camine:!!c.camine,levante:!!c.levante,micro:!!c.micropausa};
 d.note=o.note||'';return d}
function migMarcha(d){if(!d||d.mv===1)return;
 const sh=k=>{const m=/^(warm\d):(\d+)$/.exec(k);if(!m)return k;const i=+m[2];return i<8?k:i===8?null:m[1]+':'+(i-1)};
 ['done','tm'].forEach(f=>{if(!d[f])return;const o={};Object.keys(d[f]).forEach(k=>{const nk=sh(k);if(nk)o[nk]=d[f][k]});d[f]=o});
 if(d.lastEx){d.lastEx=sh(d.lastEx)||null}
 if(d.wk)Object.keys(d.wk).forEach(g=>{if(!/^warm\d$/.test(g)||!d.wk[g])return;const w=d.wk[g],o=Array.isArray(w)?[]:{};Object.keys(w).forEach(x=>{x=+x;if(x===8)return;o[x<8?x:x-1]=w[x]});d.wk[g]=o});
 d.mv=1;d._u=Date.now()}
function migGroups(d){if(!d)return false;migMarcha(d);let ch=false;
 const has=Object.keys(d.done||{}).some(k=>/^(warm|neck|hipo):/.test(k))||['warm','neck','hipo'].some(g=>d.wk&&d.wk[g]!==undefined)||['warm','neck','hipo'].some(g=>(d.lastEx||'').startsWith(g+':'));
 if(!has)return false;
 let n=0;for(let x=0;x<3;x++)if(dayTouched(d,x)){n=x;break}
 const fix=k=>k.replace(/^(warm|neck|hipo):/,'$1'+n+':');
 ['done','tm'].forEach(f=>{if(!d[f])return;const o={};Object.keys(d[f]).forEach(k=>{const nk=fix(k);if(nk!==k)ch=true;o[nk]=d[f][k]});d[f]=o});
 ['warm','neck','hipo'].forEach(g=>{if(d.wk&&d.wk[g]!==undefined){d.wk[g+n]=d.wk[g];delete d.wk[g];ch=true}});
 if(d.lastEx)d.lastEx=fix(d.lastEx);
 if(ch)d._u=Date.now();return ch}
function load(){try{const n=JSON.parse(localStorage.getItem(KEY)||'null');if(n){Object.keys(n).forEach(k=>migGroups(n[k]));return n}}catch(e){}
 const out={};try{const old=JSON.parse(localStorage.getItem(OLDKEY)||'{}');for(const k in old)out[k]=migrate(old[k])}catch(e){}return out}
let showTrain=null,db=load(),cur=todayKey(),lastToday=todayKey(),tab='hoy',exDay=0,range=30,calMonth=todayKey().slice(0,7),calSel=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function day(){return db[cur]||newDay()}
function upd(fn,rerender=true){if(!db[cur])db[cur]=newDay();fn(db[cur]);db[cur]._u=Date.now();markDirty(cur);persist();if(rerender)render();else{const s=document.getElementById('saved');if(s)s.textContent='Guardado ✓'}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function mealsFull(d){return MEALS.every(m=>((d.meals||{})[m[0]]||'').trim())}
function habitFlags(d){const h=d.habits||{};return [d.sleepSet!==false&&d.sleep!=null&&d.sleep>=7,!!h.respiro,!!h.camine,!!h.levante,!!h.micro]}
/* entreno vale 3; comidas completas, sueño y cada hábito valen 1 (total 9) */
function score(d){if(!d)return null;
 return ((d.train!=null?3:0)+(mealsFull(d)?1:0)+habitFlags(d).filter(Boolean).length)/9}

/* ---------- helpers ---------- */
function scale(label,key,inv){const d=day(),v=d[key];let b='';
 for(let i=0;i<=10;i++){const t=inv?1-i/10:i/10,hue=Math.round(130-130*t);
  b+=`<button class="${v===i?'on':''}" style="${v===i?`background:hsl(${hue},58%,42%)`:''}" onclick="upd(d=>d.${key}=d.${key}===${i}?null:${i})">${i}</button>`}
 return `<div class="scale-l"><span>${label}</span><span>${v==null?'sin dato':v+' / 10'}</span></div><div class="scale">${b}</div>`}
function sleepType(v){const n=parseFloat(String(v).replace(',','.'));upd(d=>{if(isNaN(n)){d.sleepSet=false;d.sleep=8}else{d.sleep=Math.min(14,Math.max(0,n));d.sleepSet=true}},false)}
function cbRow(on,label,fn){return `<div class="row" onclick="${fn}"><div class="cb ${on?'on':''}"></div><div class="lab">${label}</div></div>`}

/* ---------- HOY ---------- */
function updK(k,fn){if(!db[k])db[k]=newDay();fn(db[k]);db[k]._u=Date.now();markDirty(k);persist()}
const PRAISE=['¡Bien hecho! 🎉','¡Perfecto, lo estás haciendo muy bien! 💪','¡Día completado! Seguí así 🔥','¡Eso es constancia! 👏','¡Orgulloso de vos! ⭐'];
function addGoal(){const i=document.getElementById('gin'),t=i.value.trim();if(!t)return;
 updK(addDays(cur,1),d=>{d.goals=d.goals||[];d.goals.push({t,done:false})});toast('Agregado para mañana ✓');render()}
function toggleGoal(i){upd(d=>{d.goals[i].done=!d.goals[i].done});
 const g=day().goals||[];if(g.length&&g.every(x=>x.done))toast(PRAISE[Math.floor(Math.random()*PRAISE.length)])}
function delGoal(k,i){updK(k,d=>d.goals.splice(i,1));render()}
function vHoy(){const d=day(),h=d.habits,sc=score(db[cur]);
 const pct=sc==null?0:Math.round(sc*100),goals=d.goals||[],nxt=addDays(cur,1),ng=(db[nxt]&&db[nxt].goals)||[];
 const gl=goals.length?goals.map((g,i)=>`<div class="row"><div class="cb ${g.done?'on':''}" onclick="toggleGoal(${i})"></div><div class="lab" onclick="toggleGoal(${i})" style="${g.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(g.t)}</div><button class="ib" style="width:30px;height:30px;font-size:15px" onclick="delGoal('${cur}',${i})">×</button></div>`).join(''):'<div class="empty" style="padding:8px">Sin objetivos para hoy. Los cargás la noche anterior en «Objetivos para mañana».</div>';
 const nl=ng.length?ng.map((g,i)=>`<div class="snack"><span class="tx">${esc(g.t)}</span><button onclick="delGoal('${nxt}',${i})">×</button></div>`).join(''):'';
 return `<div class="g c2">
 <div class="col">

/* ---------- timers ---------- */
const fmt=ms=>{ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),r=ms%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
const PH=['w','t','x'],PHN={w:'Calentamiento',t:'Entrenamiento',x:'Estiramiento'};
function running(d){const h=d&&d.ph;return !!h&&PH.includes(h.cur)&&!!h.since}
function phMs(d,p,k){const h=d&&d.ph;if(!h)return 0;let v=(h.a&&h.a[p])||0;
 if(h.cur===p&&h.since){const stale=(k||cur)!==todayKey(),e=stale?(d.last||h.since):Date.now();v+=Math.max(0,e-h.since)}return v}
function sessMs(d,k){if(d&&d.ph)return PH.reduce((t,p)=>t+phMs(d,p,k),0);
 const s=d&&d.sess;if(!s)return 0;const stale=!s.end&&(k||cur)!==todayKey(),now=Date.now(),e=s.end||(stale?(d.last||s.start):now);
 return e-s.start-(s.pt||0)-(s.pa&&!stale?now-s.pa:0)}
function phDone(d,n,p){const L=p==='w'?[['warm'+n,WARMUP]]:p==='t'?[['d'+n,WORKOUTS[n].ex],['neck'+n,NECK]]:[['s'+n,STRETCH[n]]];
 return L.every(([g,l])=>l.every((e,i)=>timesDone(d,g,i)>0))}
function phSet(d,p,now){const h=d.ph;if(h.cur&&PH.includes(h.cur)&&h.since)h.a[h.cur]=(h.a[h.cur]||0)+(now-h.since);h.cur=p;h.pa=null;h.since=p==='end'?null:now}
function phAdvance(d,n){const h=d.ph;if(!h||h.cur==='end')return false;const now=Date.now(),nx=PH.find(p=>!phDone(d,n,p));
 if(!nx){phSet(d,'end',now);d.train='train';return true}
 if(nx!==h.cur&&!h.pa)phSet(d,nx,now);return false}
function sessStart(){upd(d=>{const n=Date.now();d.sess=null;d.ph={cur:'w',a:{w:0,t:0,x:0},since:n,pa:null};d.last=n;d.lastEx=null;phAdvance(d,exDay)})}
function sessPause(){upd(d=>{const h=d.ph,n=Date.now();if(!h||!PH.includes(h.cur))return;
 if(h.pa){const g=n-h.pa;if(d.last)d.last+=g;h.since=n;h.pa=null}else{h.a[h.cur]=(h.a[h.cur]||0)+(n-h.since);h.since=null;h.pa=n}})}
function sessEnd(){upd(d=>{const h=d.ph;if(!h)return;phSet(d,'end',Date.now())});toast('Entreno terminado ✓')}
function sessResume(){upd(d=>{const h=d.ph,n=Date.now();if(!h)return;phSet(d,PH.find(p=>!phDone(d,exDay,p))||'x',n);d.last=n})}
function timerCard(d){const live=cur===todayKey(),h=d.ph,st=!h?0:h.cur==='end'?3:h.pa?2:1;
 const cell=p=>`<div class="tc${h&&h.cur===p?' cur':''}${h&&h.cur===p&&st===1?' run':''}${h&&phDone(d,exDay,p)?' fin':''}"><small>${PHN[p]}</small><b id="ph_${p}">${fmt(phMs(d,p,cur))}</b></div>`;

function chime(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC(),t0=c.currentTime+.05;
 const tone=(f,t,d,v,ty)=>{const o=c.createOscillator(),g=c.createGain();o.type=ty||'triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v,t0+t+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+t+d);o.start(t0+t);o.stop(t0+t+d+.05)};
 [[523.25,0],[659.25,.1],[783.99,.2],[1046.5,.3],[1318.5,.42]].forEach(([f,t])=>{tone(f,t,.35,.22);tone(f*2,t,.25,.06,'sine')});
 [1046.5,1318.5,1568,2093].forEach(f=>{tone(f,.6,1.3,.16);tone(f/2,.6,1.3,.08,'sine')});
 [2637,3136,3951].forEach((f,i)=>tone(f,.75+i*.09,.35,.05,'sine'))}catch(e){}}
function celebrate(){const d=day();
 document.getElementById('wint').innerHTML=PH.map(p=>`<div><small>${PHN[p]}</small><b>${fmt(phMs(d,p,cur))}</b></div>`).join('')+`<div class="tt"><small>Total</small><b>${fmt(sessMs(d,cur))}</b></div>`;
 document.getElementById('conf').innerHTML=Array.from({length:42},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${(Math.random()*1.4).toFixed(2)}s;animation-duration:${(2.2+Math.random()*1.8).toFixed(2)}s;background:${['#F5C518','#FFD95A','#E0A800','#FFF1A8'][i%4]};transform:rotate(${Math.random()*360|0}deg)"></i>`).join('');
 document.getElementById('win').classList.add('show');chime()}
function closeWin(){document.getElementById('win').classList.remove('show')}

exDay=suggestDay();render();tick();authInit();
</script>
